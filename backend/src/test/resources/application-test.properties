# Usado só nos testes (perfil "test"). O banco real vem do Testcontainers via @ServiceConnection;
# os valores abaixo apenas evitam placeholders sem valor (${DB_USER} etc.) do application.yml.
spring.datasource.url=jdbc:postgresql://localhost:5432/test
spring.datasource.username=test
spring.datasource.password=test

app.jwt.secret=chave-secreta-usada-apenas-nos-testes-com-mais-de-32-caracteres
app.jwt.expiration-minutes=60

# Sem admin inicial: cada teste cria os usuários de que precisa
app.admin.nome=Administrador
app.admin.email=
app.admin.senha=