spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 120
  admin:
    nome: ${ADMIN_NOME:Administrador}
    email: ${ADMIN_EMAIL:admin@email.com}
    senha: ${ADMIN_PASSWORD:admin1231}